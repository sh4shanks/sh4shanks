name: Generate Pac-Man Contribution Graph

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download Pac-Man generator
        run: |
          git clone --depth 1 https://github.com/gregkozakiewicz/pacman-contribution-graph.git /tmp/pacman-generator

      - name: Generate Pac-Man animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          node /tmp/pacman-generator/src/generate.mjs --out dist

      - name: Publish Pac-Man animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
